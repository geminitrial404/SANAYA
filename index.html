<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanaya AI Assistant</title>
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            window.global = window;
            var realFetch = window.fetch;
            var currentFetch = realFetch;

            function makeWritable(obj) {
              try {
                Object.defineProperty(obj, 'fetch', {
                  get: function() {
                    return currentFetch || realFetch;
                  },
                  set: function(val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (e) {}
            }

            if (typeof Window !== 'undefined' && Window.prototype) {
              makeWritable(Window.prototype);
            }
            makeWritable(window);
          }
        } catch (e) {
          console.warn('Fetch setter fix warning:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
